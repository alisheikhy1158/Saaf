# =============================================================================
# codemagic.yaml — Saaf cloud builds (no Xcode / Android Studio needed locally)
# =============================================================================
# Lives at the REPO ROOT (D:\Saaf). The Flutter project is in ./myapp,
# so every script starts with `cd $APP_DIR`.
#
# Workflows:
#   ci-tests         -> every push / pull request: analyze + tests (Linux, cheap)
#   android-release  -> on tag v*: builds signed .aab, uploads to Play "internal" track
#   ios-release      -> on tag v*: builds signed .ipa, uploads to TestFlight
#
# Release = run locally:   git tag v1.0.0   then   git push origin v1.0.0
#
# -----------------------------------------------------------------------------
# ONE-TIME SETUP IN THE CODEMAGIC DASHBOARD (nothing secret goes in this file!)
# -----------------------------------------------------------------------------
# A) Connect the repo: codemagic.io -> Add application -> GitHub -> select Saaf repo
#    -> choose "codemagic.yaml" as configuration.
#
# B) iOS (needs a paid Apple Developer Program membership):
#    1. App Store Connect -> Users and Access -> Integrations -> App Store Connect API
#       -> generate a key with "App Manager" access. Download the .p8 file (only
#       downloadable ONCE), note the Issuer ID and Key ID.
#    2. Codemagic -> Team settings -> Team integrations -> Developer Portal ->
#       "Manage keys" -> add the key. Name it exactly:  Saaf ASC Key
#       (must match `integrations.app_store_connect` below).
#    3. Codemagic -> Team settings -> codemagic.yaml settings -> Code signing identities:
#       - iOS certificates: "Generate certificate" (type Apple Distribution) using the key above.
#       - iOS provisioning profiles: "Fetch profiles" for com.saafapp.saaf (App Store type).
#       (Register the bundle ID + create the app record in App Store Connect first.)
#    4. Put the app's numeric Apple ID (App Store Connect -> App Information) in
#       APP_STORE_APPLE_ID below. It is not a secret.
#
# C) Android (needs a Google Play Console account):
#    1. Create an UPLOAD KEYSTORE (.jks). Without Android Studio you can use `keytool`,
#       which ships with any Java JDK:
#         keytool -genkey -v -keystore saaf-upload.jks -keyalg RSA -keysize 2048 -validity 10000 -alias saaf_upload
#       BACK IT UP (password manager + offline copy). NEVER commit it to git.
#    2. Codemagic -> Team settings -> codemagic.yaml settings -> Code signing identities
#       -> Android keystores -> upload the .jks, enter passwords + alias, and set the
#       Reference name exactly:  saaf_upload_keystore
#    3. Google Cloud: create a service account, give it access in Play Console
#       (Users and permissions -> invite the service account email -> release permissions),
#       create a JSON key. In Codemagic -> App settings -> Environment variables add
#       variable GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (paste the whole JSON, mark Secret)
#       in a group named:  google_play
#    4. The VERY FIRST .aab must be uploaded manually in Play Console (Internal testing)
#       — download it from this workflow's Artifacts. After that, uploads are automatic.
#
# D) App config (Environment variables -> group "app_config", mark Secret where sensible):
#       API_BASE_URL, RC_APPLE_API_KEY, RC_GOOGLE_API_KEY  (RevenueCat public SDK keys)
#       USE_FIREBASE (true when Firebase is set up; default false = fake backend)
#       FIREBASE_PROJECT_ID, FIREBASE_MESSAGING_SENDER_ID,
#       FIREBASE_API_KEY_ANDROID, FIREBASE_APP_ID_ANDROID,
#       FIREBASE_API_KEY_IOS, FIREBASE_APP_ID_IOS      (see docs/firebase-setup.md)
#       SUPPORT_EMAIL, DELETION_URL, LEGAL_REVIEWED    (see lib/core/config/legal_config.dart)
#    They are passed to Flutter with --dart-define and read in lib/core/config/env.dart.
#
# E) Make sure myapp/android/app/build.gradle.kts reads the CM_KEYSTORE_* env vars
#    (snippet in PLAN.md, Phase 6). Verify it ONLY by running this workflow.
# =============================================================================

definitions:
  flutter_setup: &flutter_setup
    name: Get packages & generate code
    script: |
      cd $APP_DIR
      flutter pub get
      dart run build_runner build --delete-conflicting-outputs || echo "No code generation configured yet"

  quality_gate: &quality_gate
    name: Analyze & test (release is blocked if this fails)
    script: |
      cd $APP_DIR
      flutter analyze
      flutter test

  email_me: &email_me
    email:
      recipients:
        - sheikhmuhammadali3@gmail.com   # change if needed
      notify:
        success: true
        failure: true

workflows:
  # ---------------------------------------------------------------------------
  ci-tests:
    name: CI — analyze & test
    instance_type: linux_x2            # Linux is enough for tests (no Mac minutes used)
    max_build_duration: 30
    environment:
      flutter: stable
      vars:
        APP_DIR: myapp
    triggering:
      events:
        - push
        - pull_request
      cancel_previous_builds: true
    scripts:
      - *flutter_setup
      - *quality_gate
    publishing:
      <<: *email_me

  # ---------------------------------------------------------------------------
  android-release:
    name: Android release (.aab -> Play internal testing)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - saaf_upload_keystore         # reference name from step C2
      groups:
        - google_play                  # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        - app_config                   # API_BASE_URL, RC_GOOGLE_API_KEY
      vars:
        APP_DIR: myapp
        PACKAGE_NAME: "com.saafapp.saaf"   # must equal applicationId; never changes after 1st upload
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
    scripts:
      - name: Point Gradle at the Flutter SDK (cloud machine)
        script: echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/$APP_DIR/android/local.properties"
      - *flutter_setup
      - *quality_gate
      - name: Build signed, obfuscated App Bundle
        script: |
          cd $APP_DIR
          # Next build number = latest on Play (any track) + 1; falls back to 0 before the first upload.
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || echo 0)
          flutter build appbundle --release \
            --build-number=$((LATEST + 1)) \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=RC_GOOGLE_API_KEY="$RC_GOOGLE_API_KEY" \
            --dart-define=USE_FIREBASE="${USE_FIREBASE:-false}" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_API_KEY_ANDROID="$FIREBASE_API_KEY_ANDROID" \
            --dart-define=FIREBASE_APP_ID_ANDROID="$FIREBASE_APP_ID_ANDROID" \
            --dart-define=SUPPORT_EMAIL="$SUPPORT_EMAIL" \
            --dart-define=DELETION_URL="$DELETION_URL" \
            --dart-define=LEGAL_REVIEWED="${LEGAL_REVIEWED:-false}"
    artifacts:
      - myapp/build/app/outputs/bundle/release/*.aab
      - myapp/build/app/outputs/mapping/release/mapping.txt
      - myapp/build/symbols/**          # keep! needed to read crash stack traces
    publishing:
      <<: *email_me
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal                # later: alpha (closed testing) -> production
        submit_as_draft: true          # required while the Play app is still in draft state

  # ---------------------------------------------------------------------------
  ios-release:
    name: iOS release (.ipa -> TestFlight)
    instance_type: mac_mini_m2         # iOS builds need macOS — it runs in Codemagic's cloud, not on your PC
    max_build_duration: 60
    integrations:
      app_store_connect: Saaf ASC Key  # name from step B2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default               # CocoaPods runs IN THE CLOUD during `flutter build ipa`
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.saafapp.saaf   # never changes after 1st upload
      groups:
        - app_config                   # API_BASE_URL, RC_APPLE_API_KEY
      vars:
        APP_DIR: myapp
        APP_STORE_APPLE_ID: 0000000000 # replace with the app's numeric Apple ID (step B4)
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
    scripts:
      - *flutter_setup
      - *quality_gate
      - name: Apply provisioning profiles (cloud)
        script: |
          cd $APP_DIR
          xcode-project use-profiles
      - name: Register Firebase's URL scheme (phone-number sign-in on iOS)
        script: |
          # Firebase phone sign-in needs the app's "encoded app ID" as a URL scheme:
          # 1:123:ios:abc  ->  app-1-123-ios-abc. Derived here, so nothing is committed.
          if [ -n "$FIREBASE_APP_ID_IOS" ]; then
            SCHEME="app-$(echo "$FIREBASE_APP_ID_IOS" | tr ':' '-')"
            PLIST="$CM_BUILD_DIR/$APP_DIR/ios/Runner/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $SCHEME" "$PLIST"
          fi
      - name: Build signed, obfuscated IPA
        script: |
          cd $APP_DIR
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          flutter build ipa --release \
            --build-number=$((LATEST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=RC_APPLE_API_KEY="$RC_APPLE_API_KEY" \
            --dart-define=USE_FIREBASE="${USE_FIREBASE:-false}" \
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=FIREBASE_API_KEY_IOS="$FIREBASE_API_KEY_IOS" \
            --dart-define=FIREBASE_APP_ID_IOS="$FIREBASE_APP_ID_IOS" \
            --dart-define=SUPPORT_EMAIL="$SUPPORT_EMAIL" \
            --dart-define=DELETION_URL="$DELETION_URL" \
            --dart-define=LEGAL_REVIEWED="${LEGAL_REVIEWED:-false}"
    artifacts:
      - myapp/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log     # read these if the iOS build fails
      - myapp/build/symbols/**
    publishing:
      <<: *email_me
      app_store_connect:
        auth: integration
        submit_to_testflight: true     # install on your iPhone via the TestFlight app
        submit_to_app_store: false     # submit for review manually when ready
